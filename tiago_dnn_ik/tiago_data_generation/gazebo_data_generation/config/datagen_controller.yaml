datagen_controller:
  type: "tiago_data_generation/DatagenControllerPlugin"
  arm_joint_names: ["arm_1_joint", "arm_2_joint", "arm_3_joint", "arm_4_joint", "arm_5_joint", "arm_6_joint", "arm_7_joint"]
  dual_joint_names: ["arm_right_1_joint", "arm_right_2_joint", "arm_right_3_joint", "arm_right_4_joint", "arm_right_5_joint", "arm_right_6_joint", "arm_right_7_joint"]
  start_link: "torso_lift_link"
  end_link: "gripper_grasping_frame"
  dual_end_link: "arm_right_tool_link"
  num_pos: 10000
  filename: "datagen_dual.csv"
  orient: "none"  # choose quaternion, matrix or none
  dual: True
